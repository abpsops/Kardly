name: Build Android APK

# Builds Kardly on every push to main, on demand (Actions tab → Run workflow),
# and for version tags like v1.1.0, which also publish a GitHub Release with the APK.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # true when the release signing key has been added under Settings → Secrets → Actions
      HAS_SIGNING_KEY: ${{ secrets.KARDLY_KEYSTORE_BASE64 != '' }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.4.{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build the web bundle (page, OpenCV, OCR engine, fonts)
        working-directory: app
        run: node build-web.mjs

      - name: Copy the web bundle into the Android project
        working-directory: app
        run: npx cap sync android

      - name: Restore the release signing key
        if: env.HAS_SIGNING_KEY == 'true'
        working-directory: app
        run: |
          echo "${{ secrets.KARDLY_KEYSTORE_BASE64 }}" | base64 --decode > kardly-release.jks
          {
            echo "storeFile=../../kardly-release.jks"
            echo "storePassword=${{ secrets.KARDLY_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KARDLY_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KARDLY_KEY_PASSWORD }}"
          } > keystore.properties

      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Kardly-${VERSION_NAME}.apk"

      - name: Build debug APK (no signing key configured)
        if: env.HAS_SIGNING_KEY != 'true'
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Kardly-${VERSION_NAME}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kardly-${{ env.VERSION_NAME }}
          path: Kardly-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Kardly-*.apk
          generate_release_notes: true
